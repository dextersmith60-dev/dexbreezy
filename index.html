<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dexbreezy</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #121212; color: white; }
        .container { text-align: center; }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <header class="main-nav">
        <div class="nav-logo" id="logo-trigger" title="Click to sample color">dexbreezy</div>
        <nav class="nav-links">
            <a href="#" onclick="navigateTo('projects'); return false;">Work</a>
            <a href="#" onclick="navigateTo('about'); return false;">About</a>
            <a href="mailto:hello@dexbreezy.com">Contact</a>
            <div style="position: relative;">
                <button class="download-btn" id="download-btn" title="Download options">⬇️ Download</button>
                <div class="download-menu" id="download-menu">
                    <button onclick="DownloadManager.downloadCV()">📄 Download CV</button>
                    <button onclick="DownloadManager.downloadPortfolio()">🎨 Portfolio (HTML)</button>
                    <button onclick="DownloadManager.downloadAsJSON()">📋 Data (JSON)</button>
                    <a href="/" download="dexbreezy-app.html">💾 Save Website</a>
                </div>
            </div>
            <button class="install-btn" id="install-btn" title="Install App">📥 Install</button>
            <button class="theme-toggle" id="theme-toggle" title="Toggle dark/light mode" aria-label="Toggle theme">🌙</button>
        </nav>
    </header>

    <div class="container" id="main-content">
        <div id="dynamic-content">
            <h1>dexbreezy</h1>
            <p>Creative Developer & Visionary. <br> Building the future of the web in 2026.</p>

            <div class="links">
                <a href="#" class="btn" onclick="navigateTo('projects'); return false;">Projects</a>
                <a href="#" class="btn" onclick="navigateTo('about'); return false;">About</a>
                <a href="mailto:hello@dexbreezy.com" class="btn">Contact</a>
            </div>
        </div>

        <div class="ai-input-wrapper">
            <input type="text" id="ai-cmd" placeholder="Ask system to 'show work' or 'change theme'..." aria-label="AI command input">
            <div class="suggestions" id="suggestions"></div>
        </div>
    </div>

    <footer class="site-footer">
        <div class="footer-content">
            <div class="footer-left">
                <nav class="footer-nav">
                    <a href="https://instagram.com/dexbreezy" target="_blank" rel="noopener noreferrer" title="Visit Instagram">Instagram</a>
                    <a href="https://github.com/dexbreezy" target="_blank" rel="noopener noreferrer" title="Visit GitHub">GitHub</a>
                    <a href="https://linkedin.com/in/dexbreezy" target="_blank" rel="noopener noreferrer" title="Visit LinkedIn">LinkedIn</a>
                    <a href="https://x.com/AustereGms" target="_blank" rel="noopener noreferrer" title="Visit X">X</a>
                </nav>
                <p class="copyright">&copy; 2026 dexbreezy. Crafted for the future.</p>
            </div>

            <div id="status-badge" class="badge" title="System status">
                <span class="dot"></span>
                <span id="status-text">Initializing...</span>
            </div>
        </div>
    </footer>

    <div id="update-banner" class="update-banner">
        <span>A new version is available.</span>
        <button id="update-btn-reload">Update & Reload</button>
    </div>
</body>
</html>
